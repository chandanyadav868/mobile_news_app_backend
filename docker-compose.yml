services:
  # ─── PostgreSQL 16 Database (Strictly Capped for 1 vCPU / 4 GB VPS) ─────────
  postgres:
    image: postgres:16-alpine
    container_name: newsflow_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-newsflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-newsflow_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-newsflow_db}
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=4MB
      -c maintenance_work_mem=16MB
      -c max_connections=50
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-newsflow_user} -d ${POSTGRES_DB:-newsflow_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 150M
          cpus: '0.25'
    networks:
      - newsflow-network

  # ─── Redis 7 High-Speed In-Memory Cache (Strictly Capped with LRU Eviction) ─
  redis:
    image: redis:7-alpine
    container_name: newsflow_redis
    restart: always
    command: [ "redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", "" ]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.10'
    networks:
      - newsflow-network

  # ─── NewsFlow Production Backend Server (Node.js API) ──────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: newsflow_api:latest
    container_name: newsflow_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-newsflow_user}:${POSTGRES_PASSWORD:-newsflow_secret_password}@postgres:5432/${POSTGRES_DB:-newsflow_db}?schema=public
      REDIS_URL: redis://redis:6379
      ENABLE_LOCAL_OLLAMA: "false"
      LOCAL_LLM_ENABLED: "false"
      GROQ_API_KEY: ${GROQ_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      CORS_ORIGIN: "*"
      RSS_INGEST_INTERVAL_MINUTES: 25
      INGEST_CRON_SCHEDULE: "*/25 * * * *"
      READABILITY_MAX_CONCURRENCY: 2
    ports:
      - "${PORT:-4000}:4000"
    deploy:
      resources:
        limits:
          memory: 250M
          cpus: '0.35'
    networks:
      - newsflow-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  newsflow-network:
    driver: bridge
